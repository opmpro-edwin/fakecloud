[package]
name = "fakecloud-elbv2"
description = "Elastic Load Balancing v2 (ALB/NLB/GWLB) for FakeCloud"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true

[dependencies]
fakecloud-aws = { workspace = true }
fakecloud-core = { workspace = true }
fakecloud-persistence = { workspace = true }
fakecloud-wafv2 = { workspace = true }
fakecloud-ec2 = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
futures-util = "0.3"
http = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
# TLS to HTTPS targets on the WebSocket upgrade path (reqwest covers plain
# requests). `ring` as in the other crates that pin a rustls provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
